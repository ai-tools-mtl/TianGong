services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: tiangong-postgres
    environment:
      POSTGRES_USER: tiangong
      POSTGRES_PASSWORD: tiangong
      POSTGRES_DB: tiangong
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tiangong"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
