# 天工 Docker Compose
#
# 两种用法:
#   1. 本地开发(只起数据层 + embedding,应用用 uv/pnpm 手动起):
#      docker compose up -d postgres minio embedding
#
#   2. 内网全栈部署(四个服务全起,一键起):
#      docker compose --env-file .env.production --profile full up -d --build
#      详见 docs/deploy-internal.md
#
# 全栈服务(api/web)挂在 `full` profile 下,默认不起,
# 避免本地开发时误起应用容器与本地 uv/pnpm 进程抢端口。
#
# embedding 服务默认随数据层一起起(本地开发也需要向量检索),
# 但 CPU 首次启动需下载 bge-m3 模型(~2.3GB),建议预拉镜像 + 首次单独起。

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: tiangong-postgres
    environment:
      POSTGRES_USER: tiangong
      POSTGRES_PASSWORD: tiangong
      POSTGRES_DB: tiangong
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tiangong"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:latest
    container_name: tiangong-minio
    environment:
      MINIO_ROOT_USER: tiangong
      MINIO_ROOT_PASSWORD: tiangong12345
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Embedding 微服务:Infinity 跑 BAAI/bge-m3,暴露 OpenAI 兼容 /v1/embeddings。
  # 后端通过 EMBEDDING_BASE_URL 访问:本地开发用 http://localhost:7997/v1,
  # 容器内(api 容器)用 http://embedding:7997/v1。
  #
  # 模型从本地目录加载(避免联网下载 ~2.3GB):默认 ./models/bge-m3(相对 compose 文件)。
  # 路径可通过 EMBEDDING_MODEL_DIR 环境变量覆盖(如 worktree 场景指向主仓库的绝对路径)。
  # 模型需自行下载(huggingface-cli download BAAI/bge-m3 或 modelscope),models/ 已 gitignore。
  #
  # 默认 CPU(torch 引擎);切 GPU 时:
  #   1) image 改 michaelf34/infinity:latest
  #   2) 取消下面 deploy.resources.reservations.devices 注释(需 NVIDIA Container Toolkit)
  #   torch 引擎 GPU/CPU 通用,无需改 --engine。
  embedding:
    image: michaelf34/infinity:latest-cpu
    container_name: tiangong-embedding
    # 镜像 entrypoint 已是 infinity_emb,command 从子命令 v2 开始。
    # --model-id 传容器内挂载路径(本地模型,跳过联网下载)。
    command: >
      v2
      --engine torch
      --model-id /data/models/bge-m3
      --port 7997
    environment:
      # HF_HOME 只管 tokenizer 等小文件缓存;权重已随挂载目录就位,不联网
      HF_HOME: /data/.cache
      DO_NOT_TRACK: "1"
    ports:
      - "7997:7997"
    volumes:
      # 本地预下载的模型目录(只读挂载,避免容器误改)。
      # 默认 ./models/bge-m3;worktree 等场景用 EMBEDDING_MODEL_DIR 覆盖为绝对路径。
      - ${EMBEDDING_MODEL_DIR:-./models/bge-m3}:/data/models/bge-m3:ro
      # 持久化 HF 缓存(tokenizer 等运行时产物)
      - embdata:/data/.cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7997/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      # 模型已本地化,启动只需加载权重进内存,CPU 约 30-60 秒
      start_period: 120s
    restart: unless-stopped
    # GPU 切换时取消注释(需先修复 NVIDIA Container Toolkit):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # Rerank 微服务:Infinity 跑 BAAI/bge-reranker-v2-m3,暴露 OpenAI 兼容 /rerank。
  # 与 embedding 服务同款镜像、同款挂载方式,仅模型与端口不同。
  # 后端通过 RERANK_BASE_URL 访问:本地开发用 http://localhost:7998,
  # 容器内(api 容器)用 http://rerank:7998。
  # 默认随数据层一起起(本地开发也需要);首次启动需下载/挂载 bge-reranker-v2-m3 模型(~2.2GB)。
  rerank:
    image: michaelf34/infinity:latest-cpu
    container_name: tiangong-rerank
    command: >
      v2
      --engine torch
      --model-id /data/models/bge-reranker-v2-m3
      --port 7998
    environment:
      HF_HOME: /data/.cache
      DO_NOT_TRACK: "1"
    ports:
      - "7998:7998"
    volumes:
      # 本地预下载的模型目录(只读挂载,避免容器误改)。
      # 默认 ./models/bge-reranker-v2-m3;worktree 场景用 RERANK_MODEL_DIR 覆盖为绝对路径。
      - ${RERANK_MODEL_DIR:-./models/bge-reranker-v2-m3}:/data/models/bge-reranker-v2-m3:ro
      - rerankdata:/data/.cache
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7998/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s
    restart: unless-stopped

  # NLI 矛盾判断小模型(复用 Infinity 镜像,换模型目录与端口)。
  # 判断新旧记忆是否矛盾,供 save_memory 矛盾覆盖用(spec §5)。
  # 模型从本地目录加载(避免联网下载 ~700MB):默认 ./models/nli-deberta-v3-base。
  # 路径可通过 NLI_MODEL_DIR 覆盖(如 worktree 场景指向主仓库绝对路径),与 embedding 一致。
  # 模型需自行下载(huggingface-cli download cross-encoder/nli-deberta-v3-base),models/ 已 gitignore。
  # 国内有网速问题可用镜像:HF_ENDPOINT=https://hf-mirror.com huggingface-cli download ...
  #
  # NLI 是软依赖:服务挂掉时 judge_relation 降级 neutral 走合并不删,记忆功能仍正常。
  # 故 api 服务**不** depends_on nli(与 embedding 不同,embedding 是硬依赖)。
  # 端口规划:7997 embedding / 7998 rerank / 7999 NLI(rerank 先占用 7998,NLI 让步到 7999)。
  nli:
    image: michaelf34/infinity:latest-cpu
    container_name: tiangong-nli
    # 镜像 entrypoint 已是 infinity_emb,command 从子命令 v2 开始(同 embedding)。
    command: >
      v2
      --engine torch
      --model-id /data/models/nli-deberta-v3-base
      --port 7999
    environment:
      # 同 embedding:HF_HOME 管 tokenizer 等小文件缓存,权重随挂载目录就位,不联网
      HF_HOME: /data/.cache
      DO_NOT_TRACK: "1"
    ports:
      - "7999:7999"
    volumes:
      # 本地预下载的 NLI 模型目录(只读挂载);worktree 场景用 NLI_MODEL_DIR 覆盖为绝对路径。
      - ${NLI_MODEL_DIR:-./models/nli-deberta-v3-base}:/data/models/nli-deberta-v3-base:ro
      # 持久化 HF 缓存(tokenizer 等运行时产物)
      - nlidata:/data/.cache
    healthcheck:
      # Infinity 镜像无 curl,用 python urllib(同 embedding 的 healthcheck 写法)。
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:7999/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      # NLI 模型较小(~700MB),CPU 加载约 20-40 秒
      start_period: 60s
    restart: unless-stopped

  # ---- 以下为全栈部署服务,仅在 --profile full 时启动 ----

  api:
    profiles: ["full"]
    build:
      context: ./apps/api
    container_name: tiangong-api
    # 容器间用服务名访问数据层;环境变量覆盖镜像内任何 .env
    environment:
      DATABASE_URL: postgresql+psycopg://tiangong:${POSTGRES_PASSWORD:-tiangong}@postgres:5432/tiangong
      TEST_DATABASE_URL: postgresql+psycopg://tiangong:${POSTGRES_PASSWORD:-tiangong}@postgres:5432/tiangong_test
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ORIGINS: ${CORS_ORIGINS}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-tiangong}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET_PERSONAL: ${MINIO_BUCKET_PERSONAL:-tiangong-personal}
      MINIO_BUCKET_GLOBAL: ${MINIO_BUCKET_GLOBAL:-tiangong-global}
      MINIO_SECURE: ${MINIO_SECURE:-false}
      GLM_API_KEY: ${GLM_API_KEY}
      GLM_BASE_URL: ${GLM_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
      GLM_MODEL: ${GLM_MODEL:-glm-4.7}
      # Embedding 统一走 bge-m3 微服务(本 compose 的 embedding 服务)。
      # Infinity 端点是 /embeddings(无 /v1),故 base_url 不带 /v1。
      # 容器间用服务名 embedding:7997;本地开发用 localhost:7997(在 apps/api/.env 配)。
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-http://embedding:7997}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-m3}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      # Rerank 统一走 bge-reranker-v2-m3 微服务(本 compose 的 rerank 服务)。
      # 与 embedding 对称,容器间用服务名 rerank:7998;本地开发用 localhost:7998(在 apps/api/.env 配)。
      # rerank 是 fail-open 设计,保留 RERANK_ENABLED 开关供运维降级(embedding 无开关因其挂了 RAG 直接崩)。
      RERANK_ENABLED: ${RERANK_ENABLED:-true}
      RERANK_BASE_URL: ${RERANK_BASE_URL:-http://rerank:7998}
      RERANK_MODEL: ${RERANK_MODEL:-BAAI/bge-reranker-v2-m3}
      RERANK_API_KEY: ${RERANK_API_KEY:-}
      # 【v1.1】NLI 矛盾判断服务(本 compose 的 nli 服务)。
      # 容器间用服务名 nli:7999;本地开发用 localhost:7999(在 apps/api/.env 配)。
      # 软依赖:故障时 judge_relation 降级 neutral 走合并,故 api 不 depends_on nli。
      NLI_BASE_URL: ${NLI_BASE_URL:-http://nli:7999}
      # 首个 admin 账号(entrypoint 跑 init_db 时读取,已存在则跳过)
      INIT_ADMIN_USERNAME: ${INIT_ADMIN_USERNAME:-admin}
      INIT_ADMIN_PASSWORD: ${INIT_ADMIN_PASSWORD}
      INIT_ADMIN_EMAIL: ${INIT_ADMIN_EMAIL:-admin@tiangong.dev}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      embedding:
        condition: service_healthy
      rerank:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      # 启动含 init_db(迁移+admin+seed),首次部署较慢,放宽启动宽限期
      start_period: 90s
    restart: unless-stopped

  web:
    profiles: ["full"]
    build:
      context: ./apps/web
      args:
        # build 时内联进前端产物(compose 从 .env.production 注入)
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        # npm 镜像源(网络受限环境用),默认官方源
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    container_name: tiangong-web
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
  embdata:
  rerankdata:
  nlidata:
