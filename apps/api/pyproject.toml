[project]
name = "tiangong-api"
version = "0.1.0"
description = "TianGong patent disclosure AI agent - backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.3",
    "pgvector>=0.3.6",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "bcrypt>=4.2.0,<5.0.0",
    "pyjwt>=2.10.0",
    "cryptography>=43.0.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.12",
    "loguru>=0.7.0",
    "email-validator>=2.3.0",
    "python-docx>=1.2.0",
    "minio>=7.2.0",
    "pypdf>=4.0.0",
    "diff-match-patch>=20230430",
    "langchain>=1.3.13",
    "langchain-community>=0.4.2",
    "langgraph>=1.2.9",
    "langchain-core>=1.4.9",
    "langchain-openai>=1.3.5",
    "langchain-mcp-adapters>=0.1.0",
    "mcp>=1.24.0,<2",
    "deepagents>=0.6.12",
    "docker>=7.2.0",
    "pyyaml>=6.0.3",
    "firecrawl-py>=4.0.0",
    # 限流（P0-5）：登录/注册/AI 调用等敏感端点的速率限制
    "slowapi>=0.1.10",
    # 重试/退避（P0-4）：LLM 调用层对瞬时错误（429/5xx/连接）的指数退避重试
    "tenacity>=9.1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
